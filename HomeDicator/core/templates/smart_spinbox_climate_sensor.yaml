# Smart spinbox climate sensor with 10°F offset logic for dual-setpoint thermostats
# This template creates a single sensor that monitors the appropriate setpoint based on mode
platform: homeassistant
id: ${hass_climate_id}_smart_setpoint
entity_id: climate.${hass_climate_id}
attribute: temperature  # Monitor current temperature to trigger updates when setpoints change
on_value:
  - lvgl.widget.update:
      id: lvgl_smart_spinbox_${hass_climate_id}
      state:
        disabled: false
  - if:
     condition:
       lambda: |-
         return !id(user_is_interacting);
     then:
      - lvgl.spinbox.update:
          id: lvgl_smart_spinbox_${hass_climate_id}
          value: !lambda |-
            // Get current mode and both setpoints from HA sensors
            std::string mode = id(mode_${hass_climate_id}).state;
            float heat_temp = id(${hass_climate_id}_heat_setpoint).state;
            float cool_temp = id(${hass_climate_id}_cool_setpoint).state;
            
            // Return appropriate value based on mode
            if (mode == "heat") {
              return heat_temp;
            } else if (mode == "cool") {
              if (!isnan(cool_temp)) {
                return cool_temp;
              }
            } else if (mode == "heat_cool" || mode == "auto") {
              // Show average of both setpoints
              if (!isnan(cool_temp) && !isnan(heat_temp)) {
                return (heat_temp + cool_temp) / 2.0;
              }
            }
            // Default fallback
            return heat_temp;
