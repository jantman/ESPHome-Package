# Smart spinbox on_value helper for dual-setpoint thermostats, using Home Assistant service calls.
#
# In heat or cool mode, the chosen value is written to BOTH setpoints. The screen shows only
# the setpoint for the current mode, so anything else written to the other one is invisible
# here, and only takes effect at the next mode change. An earlier version wrote the other
# setpoint as x +/- 10, which left zones cooling to 79-80F (or heating to 62F) after an
# automatic heat/cool changeover days later. heat_cool/auto keeps a +/- 5 band, because equal
# setpoints there would swap between heating and cooling within the deadband.
if:
  condition:
    lambda: |-
      return id(user_is_interacting);
  then:
    - logger.log:
        format: "Smart thermostat: Mode=%s, Target=%.1f"
        args: ['id(mode_${hass_climate_id}).state.c_str()', 'static_cast<float>(x)']
        level: DEBUG
    - if:
        condition:
          lambda: |-
            std::string mode = id(mode_${hass_climate_id}).state;
            return mode == "heat";
        then:
          - homeassistant.action:
              action: climate.set_temperature
              data:
                entity_id: climate.${hass_climate_id}
                target_temp_low: !lambda 'return x;'
                target_temp_high: !lambda 'return x;'
    - if:
        condition:
          lambda: |-
            std::string mode = id(mode_${hass_climate_id}).state;
            return mode == "cool";
        then:
          - homeassistant.action:
              action: climate.set_temperature
              data:
                entity_id: climate.${hass_climate_id}
                target_temp_low: !lambda 'return x;'
                target_temp_high: !lambda 'return x;'
    - if:
        condition:
          lambda: |-
            std::string mode = id(mode_${hass_climate_id}).state;
            return mode == "heat_cool" || mode == "auto";
        then:
          - homeassistant.action:
              action: climate.set_temperature
              data:
                entity_id: climate.${hass_climate_id}
                target_temp_low: !lambda 'return x - 5;'
                target_temp_high: !lambda 'return x + 5;'
